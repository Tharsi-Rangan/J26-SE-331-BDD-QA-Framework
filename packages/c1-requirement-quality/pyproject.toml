[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "c1-requirement-quality"
version = "0.1.0"
description = "C1 Grounded Requirement Quality and Refinement (Jathusan J.)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23",
  "referencing>=0.35",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
c1 = "c1_requirement_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
