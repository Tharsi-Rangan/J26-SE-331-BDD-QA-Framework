name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node:
    name: node (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  python:
    name: python (c1 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/c1-requirement-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,rag]"
      - run: pytest
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
