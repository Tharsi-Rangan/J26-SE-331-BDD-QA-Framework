name: contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Validate golden fixtures (schemas + cross-file links)
        run: |
          node packages/contracts/scripts/validate.mjs packages/contracts/fixtures/golden/example-registration
          for d in fixtures/golden/*/; do if [ -d "$d" ]; then node packages/contracts/scripts/validate.mjs "$d"; fi; done